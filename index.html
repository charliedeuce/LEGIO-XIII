<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LEGIO XIII</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B0E11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Legio XIII">
<style>
  :root{
    --bg:#0B0E11;
    --panel:#12161B;
    --panel2:#171C22;
    --line:#242B33;
    --text:#DCE3EA;
    --muted:#7C8896;
    --amber:#E8A33D;
    --green:#3FB950;
    --red:#F85149;
    --blue:#58A6FF;
    --purple:#B392F0;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141920,#0f1319);
  }
  header h1{
    font-size:18px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin:0;
    font-weight:700;
    color:var(--red);
  }
  header .sub{
    font-size:11px;
    color:var(--muted);
    letter-spacing:1px;
    margin-top:2px;
  }
  #clock{
    font-family:var(--mono);
    font-size:22px;
    color:var(--amber);
    letter-spacing:2px;
  }
  main{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:0;
    min-height:calc(100vh - 65px);
  }
  #board{
    padding:20px 24px;
    overflow-y:auto;
  }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
    align-items:center;
  }
  .toolbar select, .toolbar input, .toolbar button{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-size:13px;
    font-family:var(--sans);
  }
  .toolbar button{
    cursor:pointer;
    font-weight:600;
  }
  .toolbar button.primary{
    background:var(--amber);
    color:#241a06;
    border-color:var(--amber);
  }
  .toolbar button:hover{filter:brightness(1.15);}
  .stat-strip{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .stat{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 14px;
  }
  .stat .n{font-size:22px;font-weight:700;font-family:var(--mono);}
  .stat .l{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
  .stat.available .n{color:var(--green);}
  .stat.assigned .n{color:var(--amber);}
  .stat.enroute .n{color:var(--blue);}
  .stat.oos .n{color:var(--red);}

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:14px;
  }
  .unit{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--muted);
    border-radius:6px;
    padding:14px;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .unit:hover{border-color:var(--amber);}
  .unit.status-available{border-left-color:var(--green);}
  .unit.status-assigned{border-left-color:var(--amber);}
  .unit.status-enroute{border-left-color:var(--blue);}
  .unit.status-oos{border-left-color:var(--red);}
  .unit-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .callsign{
    font-family:var(--mono);
    font-size:17px;
    font-weight:700;
    letter-spacing:1px;
  }
  .type-badge{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    border:1px solid var(--line);
    padding:2px 6px;
    border-radius:3px;
  }
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:3px 8px;
    border-radius:3px;
  }
  .badge.status-available{background:rgba(63,185,80,.15);color:var(--green);}
  .badge.status-assigned{background:rgba(232,163,61,.15);color:var(--amber);}
  .badge.status-enroute{background:rgba(88,166,255,.15);color:var(--blue);}
  .badge.status-oos{background:rgba(248,81,73,.15);color:var(--red);}
  .unit-field{
    font-size:12.5px;
    color:var(--muted);
    margin-top:6px;
  }
  .unit-field b{color:var(--text);font-weight:600;}
  .unit-ts{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--muted);
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:8px;
  }
  .remove-x{
    float:right;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
  }
  .remove-x:hover{color:var(--red);}

  #log-panel{
    background:var(--panel2);
    border-left:1px solid var(--line);
    padding:18px;
    display:flex;
    flex-direction:column;
  }
  #log-panel h2{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 12px;
  }
  #log-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column-reverse;
    gap:8px;
  }
  .log-entry{
    font-family:var(--mono);
    font-size:11.5px;
    line-height:1.5;
    border-bottom:1px dashed var(--line);
    padding-bottom:6px;
  }
  .log-entry .t{color:var(--amber);}
  .log-entry .c{color:var(--text);font-weight:700;}
  .log-entry.radio{border-bottom-color:var(--blue);}
  .log-entry.radio .t{color:var(--blue);}
  .log-entry .tag{
    display:inline-block;
    font-size:9px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--blue);
    border:1px solid var(--blue);
    border-radius:3px;
    padding:0 4px;
    margin-right:4px;
    vertical-align:1px;
  }
  #log-panel select, #log-panel input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 9px;
    border-radius:4px;
    font-size:12.5px;
    font-family:var(--sans);
  }
  #log-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  #log-actions button{
    flex:1;
    min-width:90px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px;
    border-radius:4px;
    cursor:pointer;
    font-size:12px;
  }
  #log-actions button:hover{filter:brightness(1.2);}
  #backup-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  #backup-actions button{
    flex:1;
    min-width:90px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px;
    border-radius:4px;
    cursor:pointer;
    font-size:12px;
  }
  #backup-actions button:hover{filter:brightness(1.2);}

  /* Modal */
  #overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  #overlay.show{display:flex;}
  #modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:22px;
    width:360px;
    max-width:90vw;
  }
  #modal h3{
    margin:0 0 16px;
    font-family:var(--mono);
    font-size:16px;
    color:var(--amber);
  }
  #modal label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    margin:12px 0 5px;
  }
  #modal input, #modal select{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:4px;
    font-size:13px;
    font-family:var(--sans);
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .modal-actions button{
    flex:1;
    padding:10px;
    border-radius:4px;
    border:1px solid var(--line);
    cursor:pointer;
    font-weight:600;
    font-size:13px;
  }
  .modal-actions .save{background:var(--amber);color:#241a06;border-color:var(--amber);}
  .modal-actions .cancel{background:transparent;color:var(--muted);}
  #empty-msg{
    color:var(--muted);
    font-size:13px;
    padding:40px 10px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:6px;
  }

  @media (max-width: 768px){
    header{
      padding:12px 16px;
      flex-wrap:wrap;
      gap:6px;
    }
    header h1{font-size:16px;}
    #clock{font-size:18px;}
    main{
      grid-template-columns:1fr;
      grid-template-rows:auto auto;
    }
    #board{padding:14px 16px;}
    .stat-strip{flex-wrap:wrap;}
    .stat{min-width:calc(50% - 5px);}
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar select, .toolbar input, .toolbar button{
      width:100%;
      padding:12px 10px;
      font-size:15px;
    }
    #grid{
      grid-template-columns:1fr;
      gap:12px;
    }
    .unit{padding:16px;}
    .callsign{font-size:19px;}
    #log-panel{
      border-left:none;
      border-top:1px solid var(--line);
      padding:16px;
    }
    #log-panel select, #log-panel input{
      padding:12px 10px;
      font-size:15px;
    }
    #log-panel button, .toolbar button{
      min-height:44px;
    }
    #log-list{max-height:320px;}
    #overlay{padding:16px;}
    #modal{width:100%;padding:18px;}
    #modal input, #modal select{
      padding:12px 10px;
      font-size:15px;
    }
    .modal-actions button{min-height:44px;font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Legio XIII</h1>
    <div class="sub">Semper Vigilans</div>
  </div>
  <div id="clock">--:--:--</div>
</header>

<main>
  <div id="board">
    <div class="stat-strip">
      <div class="stat available"><div class="n" id="count-available">0</div><div class="l">Available</div></div>
      <div class="stat assigned"><div class="n" id="count-assigned">0</div><div class="l">Assigned</div></div>
      <div class="stat enroute"><div class="n" id="count-enroute">0</div><div class="l">En route</div></div>
      <div class="stat oos"><div class="n" id="count-oos">0</div><div class="l">Out of service</div></div>
    </div>

    <div class="toolbar">
      <select id="filter-type">
        <option value="">All types</option>
        <option value="Police">Police</option>
        <option value="Fire">Fire</option>
        <option value="EMS">EMS</option>
        <option value="Other">Other</option>
      </select>
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="available">Available</option>
        <option value="assigned">Assigned</option>
        <option value="enroute">En route</option>
        <option value="oos">Out of service</option>
      </select>
      <button class="primary" id="add-unit-btn">+ Add unit</button>
      <button id="clear-all-btn">Clear all units</button>
    </div>

    <div id="grid"></div>
    <div id="empty-msg" style="display:none;">No units yet. Click "Add unit" to start building your board.</div>
  </div>

  <div id="log-panel">
    <h2>Quick update</h2>
    <select id="quick-unit"></select>
    <input id="quick-location" placeholder="New location (blank = no change)" style="margin-top:8px;">
    <input id="quick-assignment" placeholder="New assignment (blank = no change)" style="margin-top:8px;">
    <button class="primary" id="quick-update-btn" style="margin-top:8px;width:100%;">Update unit</button>

    <h2 style="margin-top:20px;">Radio traffic</h2>
    <select id="radio-unit"></select>
    <input id="radio-text" placeholder="Traffic to log for this unit" style="margin-top:8px;">
    <button class="primary" id="radio-send-btn" style="margin-top:8px;width:100%;">Log traffic</button>

    <h2 style="margin-top:20px;">Activity log</h2>
    <div id="log-list"></div>
    <div id="log-actions">
      <button id="copy-log-btn">Copy log</button>
      <button id="download-log-btn">Download .txt</button>
      <button id="clear-log-btn">Clear log</button>
    </div>

    <h2 style="margin-top:20px;">Backup</h2>
    <div id="backup-actions">
      <button id="export-btn">Export board</button>
      <button id="import-btn">Import board</button>
    </div>
    <input type="file" id="import-file" accept="application/json" style="display:none;">
  </div>
</main>

<div id="overlay">
  <div id="modal">
    <h3 id="modal-title">Unit</h3>
    <input type="hidden" id="edit-id">
    <label>Call sign</label>
    <input id="f-callsign" placeholder="e.g. P-12, E-4, M-1">
    <label>Type</label>
    <select id="f-type">
      <option>Police</option>
      <option>Fire</option>
      <option>EMS</option>
      <option>Other</option>
    </select>
    <label>Status</label>
    <select id="f-status">
      <option value="available">Available</option>
      <option value="assigned">Assigned</option>
      <option value="enroute">En route</option>
      <option value="oos">Out of service</option>
    </select>
    <label>Location</label>
    <input id="f-location" placeholder="e.g. Cross St / 5th Ave">
    <label>Assignment / task</label>
    <input id="f-assignment" placeholder="e.g. Call #2214 - noise complaint">
    <div class="modal-actions">
      <button class="cancel" id="modal-cancel">Cancel</button>
      <button class="save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'dispatch_board_units_v1';
const LOG_KEY = 'dispatch_board_log_v1';

function safeGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return null; }
}
function safeSet(key, value){
  try{ localStorage.setItem(key, value); }
  catch(e){ /* storage blocked on this device — app still works, just won't persist */ }
}

let units = JSON.parse(safeGet(STORAGE_KEY) || '[]');
let log = JSON.parse(safeGet(LOG_KEY) || '[]');

const statusLabel = {available:'Available', assigned:'Assigned', enroute:'En route', oos:'Out of service'};

function nowStr(){
  const d = new Date();
  return d.toLocaleTimeString('en-US', {hour12:false});
}

function save(){
  safeSet(STORAGE_KEY, JSON.stringify(units));
  safeSet(LOG_KEY, JSON.stringify(log));
}

function addLog(text, radio){
  log.push({t: nowStr(), text, radio: !!radio});
  save();
  renderLog();
}

function renderLog(){
  const el = document.getElementById('log-list');
  el.innerHTML = log.map(e => `
    <div class="log-entry${e.radio ? ' radio' : ''}">
      <span class="t">[${e.t}]</span>
      ${e.radio ? '<span class="tag">Radio</span>' : ''}
      ${escapeHtml(e.text)}
    </div>
  `).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderStats(){
  const counts = {available:0, assigned:0, enroute:0, oos:0};
  units.forEach(u => counts[u.status]++);
  document.getElementById('count-available').textContent = counts.available;
  document.getElementById('count-assigned').textContent = counts.assigned;
  document.getElementById('count-enroute').textContent = counts.enroute;
  document.getElementById('count-oos').textContent = counts.oos;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const typeF = document.getElementById('filter-type').value;
  const statusF = document.getElementById('filter-status').value;
  const filtered = units.filter(u =>
    (!typeF || u.type === typeF) && (!statusF || u.status === statusF)
  );

  document.getElementById('empty-msg').style.display = units.length === 0 ? 'block' : 'none';

  grid.innerHTML = filtered.map(u => `
    <div class="unit status-${u.status}" data-id="${u.id}">
      <div class="unit-top">
        <div>
          <div class="callsign">${escapeHtml(u.callsign)}</div>
          <span class="type-badge">${u.type}</span>
        </div>
        <div>
          <span class="badge status-${u.status}">${statusLabel[u.status]}</span>
          <span class="remove-x" data-remove="${u.id}" title="Remove unit">&times;</span>
        </div>
      </div>
      <div class="unit-field"><b>Location:</b> ${escapeHtml(u.location || '—')}</div>
      <div class="unit-field"><b>Assignment:</b> ${escapeHtml(u.assignment || '—')}</div>
      <div class="unit-ts">Updated ${u.updated}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.unit').forEach(card => {
    card.addEventListener('click', (e) => {
      if(e.target.dataset.remove) return;
      openModal(card.dataset.id);
    });
  });
  grid.querySelectorAll('[data-remove]').forEach(x => {
    x.addEventListener('click', (e) => {
      e.stopPropagation();
      removeUnit(x.dataset.remove);
    });
  });

  renderStats();
  renderRadioUnitOptions();
  renderQuickUnitOptions();
}

function renderQuickUnitOptions(){
  const sel = document.getElementById('quick-unit');
  const prev = sel.value;
  if(units.length === 0){
    sel.innerHTML = '<option value="">No units on board</option>';
    sel.disabled = true;
  } else {
    sel.disabled = false;
    sel.innerHTML = units.map(u =>
      `<option value="${u.id}">${escapeHtml(u.callsign)} — ${statusLabel[u.status]}</option>`
    ).join('');
    if(units.some(u => u.id === prev)) sel.value = prev;
  }
}

function quickUpdate(){
  const sel = document.getElementById('quick-unit');
  const locEl = document.getElementById('quick-location');
  const assignEl = document.getElementById('quick-assignment');
  const id = sel.value;
  const newLoc = locEl.value.trim();
  const newAssign = assignEl.value.trim();

  if(!id){
    alert('No unit selected.');
    return;
  }
  if(!newLoc && !newAssign){
    alert('Enter a new location or assignment first.');
    return;
  }

  const u = units.find(u => u.id === id);
  const changes = [];
  if(newLoc && newLoc !== u.location){
    changes.push(`location -> ${newLoc}`);
    u.location = newLoc;
  }
  if(newAssign && newAssign !== u.assignment){
    changes.push(`assignment -> ${newAssign}`);
    u.assignment = newAssign;
  }
  if(changes.length === 0){
    alert('No change from current values.');
    return;
  }
  u.updated = nowStr();
  addLog(`${u.callsign}: ${changes.join(', ')}.`);
  locEl.value = '';
  assignEl.value = '';
  save();
  renderGrid();
}

function renderRadioUnitOptions(){
  const sel = document.getElementById('radio-unit');
  const prev = sel.value;
  const available = units.filter(u => u.status === 'available');
  if(available.length === 0){
    sel.innerHTML = '<option value="">No available units</option>';
    sel.disabled = true;
  } else {
    sel.disabled = false;
    sel.innerHTML = available.map(u =>
      `<option value="${u.id}">${escapeHtml(u.callsign)}</option>`
    ).join('');
    if(available.some(u => u.id === prev)) sel.value = prev;
  }
}

function sendRadioTraffic(){
  const sel = document.getElementById('radio-unit');
  const textEl = document.getElementById('radio-text');
  const id = sel.value;
  const text = textEl.value.trim();
  if(!id){
    alert('No available unit selected.');
    return;
  }
  if(!text){
    alert('Enter the radio traffic first.');
    return;
  }
  const u = units.find(u => u.id === id);
  addLog(`${u.callsign}: "${text}"`, true);
  textEl.value = '';
  textEl.focus();
}

function removeUnit(id){
  const u = units.find(u => u.id === id);
  if(!u) return;
  if(!confirm(`Remove unit ${u.callsign}?`)) return;
  units = units.filter(u => u.id !== id);
  addLog(`${u.callsign} removed from board.`);
  save();
  renderGrid();
}

function openModal(id){
  const overlay = document.getElementById('overlay');
  document.getElementById('modal-title').textContent = id ? 'Edit unit' : 'Add unit';
  document.getElementById('edit-id').value = id || '';

  if(id){
    const u = units.find(u => u.id === id);
    document.getElementById('f-callsign').value = u.callsign;
    document.getElementById('f-type').value = u.type;
    document.getElementById('f-status').value = u.status;
    document.getElementById('f-location').value = u.location;
    document.getElementById('f-assignment').value = u.assignment;
  } else {
    document.getElementById('f-callsign').value = '';
    document.getElementById('f-type').value = 'Police';
    document.getElementById('f-status').value = 'available';
    document.getElementById('f-location').value = '';
    document.getElementById('f-assignment').value = '';
  }
  overlay.classList.add('show');
  document.getElementById('f-callsign').focus();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}

function saveModal(){
  const id = document.getElementById('edit-id').value;
  const callsign = document.getElementById('f-callsign').value.trim();
  if(!callsign){
    alert('Enter a call sign first.');
    return;
  }
  const type = document.getElementById('f-type').value;
  const status = document.getElementById('f-status').value;
  const location = document.getElementById('f-location').value.trim();
  const assignment = document.getElementById('f-assignment').value.trim();
  const ts = nowStr();

  if(id){
    const u = units.find(u => u.id === id);
    const changes = [];
    if(u.status !== status) changes.push(`status ${statusLabel[u.status]} -> ${statusLabel[status]}`);
    if(u.location !== location) changes.push(`location -> ${location || '—'}`);
    if(u.assignment !== assignment) changes.push(`assignment -> ${assignment || '—'}`);
    u.callsign = callsign; u.type = type; u.status = status;
    u.location = location; u.assignment = assignment; u.updated = ts;
    addLog(`${callsign}: ${changes.length ? changes.join(', ') : 'details reviewed, no change'}.`);
  } else {
    units.push({
      id: 'u' + Date.now(),
      callsign, type, status, location, assignment, updated: ts
    });
    addLog(`${callsign} added to board (${statusLabel[status]}).`);
  }
  save();
  closeModal();
  renderGrid();
}

document.getElementById('add-unit-btn').addEventListener('click', () => openModal(null));
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-save').addEventListener('click', saveModal);
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});
document.getElementById('quick-update-btn').addEventListener('click', quickUpdate);
document.getElementById('quick-location').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') quickUpdate();
});
document.getElementById('quick-assignment').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') quickUpdate();
});
document.getElementById('radio-send-btn').addEventListener('click', sendRadioTraffic);
document.getElementById('radio-text').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') sendRadioTraffic();
});
document.getElementById('filter-type').addEventListener('change', renderGrid);
document.getElementById('filter-status').addEventListener('change', renderGrid);
document.getElementById('clear-all-btn').addEventListener('click', () => {
  if(units.length === 0) return;
  if(!confirm('Remove all units from the board? This does not clear the activity log.')) return;
  units = [];
  addLog('Board cleared — all units removed.');
  save();
  renderGrid();
});
document.getElementById('copy-log-btn').addEventListener('click', () => {
  const text = log.map(e => `[${e.t}] ${e.text}`).join('\n');
  const btn = document.getElementById('copy-log-btn');
  const old = btn.textContent;
  const flash = (label) => { btn.textContent = label; setTimeout(() => btn.textContent = old, 1200); };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => flash('Copied')).catch(() => flash('Copy failed'));
  } else {
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      flash('Copied');
    }catch(e){
      flash('Copy failed');
    }
  }
});
document.getElementById('download-log-btn').addEventListener('click', () => {
  const text = log.map(e => `[${e.t}] ${e.text}`).join('\n');
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dispatch-log-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.txt';
  a.click();
});
document.getElementById('clear-log-btn').addEventListener('click', () => {
  if(log.length === 0) return;
  if(!confirm('Permanently erase the entire activity log? This cannot be undone.')) return;
  log = [];
  save();
  renderLog();
});

document.getElementById('export-btn').addEventListener('click', () => {
  const payload = {
    exported: new Date().toISOString(),
    units,
    log
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'legio-xiii-backup-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
  a.click();
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{
      data = JSON.parse(reader.result);
    }catch(err){
      alert('That file is not a valid backup — could not read it.');
      e.target.value = '';
      return;
    }
    if(!Array.isArray(data.units) || !Array.isArray(data.log)){
      alert('That file does not look like a Legio XIII backup.');
      e.target.value = '';
      return;
    }
    if(!confirm('Import this backup? It will replace everything currently on the board and in the log.')) {
      e.target.value = '';
      return;
    }
    units = data.units;
    log = data.log;
    save();
    renderGrid();
    renderLog();
    e.target.value = '';
  };
  reader.readAsText(file);
});

function tickClock(){
  document.getElementById('clock').textContent = nowStr();
}
setInterval(tickClock, 1000);
tickClock();

renderGrid();
renderLog();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      /* offline caching unavailable — app still works normally, just won't cache */
    });
  });
}
</script>
</body>
</html>
